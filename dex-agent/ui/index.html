<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5l6 6h8l6-6v13a10 10 0 0 1-20 0z" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="var(--sidebar)"/><circle cx="20" cy="18" r="2" fill="var(--sidebar)"/></svg>
      <span>Dex</span>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      محادثة جديدة
    </button>
    <div class="section-title">المحادثات الأخيرة</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-foot">
      <div class="status-row">
        <span class="dot" id="dotOllama"></span><span>الموديل</span>
        <span class="dot" id="dotVoice"></span><span>الصوت</span>
      </div>
      <button id="openSettings" class="foot-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        الإعدادات
      </button>
    </div>
  </aside>

  <main class="main empty" id="main">
    <header class="topbar">
      <button id="toggleSidebar" class="icon-btn" title="القائمة">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="chatTitle" class="chat-title"></div>
    </header>

    <section id="welcome" class="welcome">
      <svg class="welcome-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5l6 6h8l6-6v13a10 10 0 0 1-20 0z" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="var(--bg)"/><circle cx="20" cy="18" r="2" fill="var(--bg)"/></svg>
      <h1 id="greeting"></h1>
      <div class="suggestions" id="suggestions"></div>
    </section>

    <section id="messages" class="messages"></section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="اكتب رسالتك لـ Dex..."></textarea>
        <div class="composer-row">
          <div class="tools-left">
            <button id="micBtn" class="icon-btn mic" title="اتكلم بصوتك">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="modeBtn" class="chip" title="غيّر الوضع"></button>
          </div>
          <div class="tools-right">
            <select id="modelSelect" title="الموديل"></select>
            <button id="sendBtn" class="send-btn" title="إرسال">
              <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">Dex شغال محليًا على جهازك وممكن يغلط — راجع الأوامر قبل ما توافق عليها.</div>
    </div>
  </main>
</div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-card">
    <h2>الإعدادات</h2>
    <label class="field"><span>الوضع الافتراضي</span>
      <select id="setMode"><option value="chat">محادثة</option><option value="agent">تحكم في الجهاز</option></select>
    </label>
    <label class="field"><span>الموديل الافتراضي</span><select id="setModel"></select></label>
    <label class="check"><input type="checkbox" id="setAutoApprove"><span>نفّذ الأوامر على الجهاز من غير ما يسألني <em>(مش مستحسن)</em></span></label>
    <label class="check"><input type="checkbox" id="setAutoSend"><span>ابعت الرسالة تلقائيًا بعد التسجيل الصوتي</span></label>
    <label class="field"><span>موديل الصوت</span>
      <select id="setWhisper"><option value="small">small (أسرع)</option><option value="medium">medium (أدق)</option></select>
    </label>
    <label class="field"><span>الشكل</span>
      <select id="setTheme"><option value="dark">غامق</option><option value="light">فاتح</option></select>
    </label>
    <label class="field"><span>عنوان Ollama</span><input id="setOllama" dir="ltr"></label>
    <label class="field"><span>تعليمات إضافية لـ Dex</span><textarea id="setExtra" rows="3" placeholder="مثلاً: اسمي سيف، رد عليا باختصار"></textarea></label>
    <div class="modal-actions">
      <button id="clearChats" class="btn danger">مسح كل المحادثات</button>
      <span class="spacer"></span>
      <button id="cancelSettings" class="btn">إلغاء</button>
      <button id="saveSettings" class="btn primary">حفظ</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
