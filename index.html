<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>سجل مشاكل الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- شاشة الباسورد: بتظهر بس لو فيه باسورد في config.js -->
<div id="lock" class="lock" dir="rtl" hidden>
  <form id="lock-form" class="lock-card" novalidate>
    <span class="brand-mark brand-mark-lg" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
    </span>
    <h1>سجل مشاكل الفريق</h1>
    <p>اكتب باسورد الفريق عشان تدخل.</p>
    <input id="lock-input" class="input" type="password" placeholder="الباسورد" autocomplete="current-password" />
    <p id="lock-error" class="field-error" hidden>الباسورد غلط، جرّب تاني.</p>
    <button type="submit" class="btn btn-primary btn-lg btn-block">دخول</button>
  </form>
</div>

<div id="app" class="shell" dir="rtl" lang="ar" hidden>

  <!-- القايمة الجانبية -->
  <aside id="sidebar" class="sidebar" aria-label="المشاكل">
    <div class="sb-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
        </span>
        <span>مشاكل الفريق</span>
      </div>
      <button id="sb-close" class="icon-btn only-mobile" type="button" aria-label="اقفل القايمة">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <button id="new-btn" type="button" class="btn btn-primary btn-block">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      مشكلة جديدة
    </button>

    <div class="sb-search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input id="search" class="input" type="search" placeholder="دوّر في المشاكل" aria-label="دوّر في المشاكل" />
      <kbd class="kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="seg" role="tablist" id="tabs" aria-label="الأقسام">
      <button type="button" role="tab" id="tab-open" data-status="open">متحلتش <span class="n" id="count-open">0</span></button>
      <button type="button" role="tab" id="tab-solved" data-status="solved">اتحلت <span class="n" id="count-solved">0</span></button>
      <button type="button" role="tab" id="tab-all" data-status="all">الكل <span class="n" id="count-all">0</span></button>
    </div>

    <nav id="list" class="sb-list" aria-label="قايمة المشاكل"></nav>

    <div class="sb-foot">
      <button id="me-btn" class="me" type="button" aria-label="غيّر اسمك">
        <span id="me-av"></span>
        <span class="me-text">
          <span id="me-name" class="me-name"></span>
          <span id="me-status" class="me-status"></span>
        </span>
        <svg class="i me-edit" viewBox="0 0 24 24"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
      </button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- المحتوى -->
  <main id="main" class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn only-mobile" type="button" aria-label="افتح قايمة المشاكل">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <div id="crumb" class="crumb"></div>
      <div id="top-actions" class="top-actions"></div>
    </header>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-action" type="button" class="link-btn" hidden></button>
    </div>

    <div id="view" class="view"></div>
  </main>
</div>

<datalist id="names"></datalist>

<dialog id="name-dialog" class="dialog" dir="rtl">
  <form id="name-form" method="dialog">
    <h2>اسمك</h2>
    <p>بيظهر جنب المشاكل اللي بتسجلها أو بتحلها، والموقع بيفتكره على الجهاز ده.</p>
    <input id="name-input" class="input" type="text" maxlength="60" list="names" autocomplete="name" placeholder="اكتب اسمك" />
    <div class="dialog-actions">
      <button type="submit" value="cancel" class="btn btn-ghost" formnovalidate>إلغاء</button>
      <button type="submit" value="save" class="btn btn-primary">حفظ</button>
    </div>
  </form>
</dialog>

<!-- عارض الصور -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصور" dir="rtl" hidden>
  <div class="lb-bar">
    <span id="lb-count" class="lb-count"></span>
    <div class="lb-actions">
      <a id="lb-open" class="lb-btn" href="#" target="_blank" rel="noopener">افتح الأصل</a>
      <button id="lb-delete" class="lb-btn danger" type="button">امسح الصورة</button>
      <button id="lb-close" class="lb-btn lb-icon" type="button" aria-label="اقفل">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
  </div>
  <div id="lb-stage" class="lb-stage">
    <button id="lb-prev" class="lb-nav lb-prev" type="button" aria-label="الصورة اللي قبلها">
      <svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
    </button>
    <img id="lb-img" alt="" />
    <button id="lb-next" class="lb-nav lb-next" type="button" aria-label="الصورة اللي بعدها">
      <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
    </button>
  </div>
</div>

<input id="file-input" type="file" accept="image/*" multiple hidden />

<div id="toast" class="toast" dir="rtl" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
