<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>سجل مشاكل الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page" dir="rtl" lang="ar">

  <!-- شاشة الباسورد: بتظهر بس لو فيه باسورد في config.js -->
  <div id="lock" class="lock" hidden>
    <form id="lock-form" class="panel lock-card" novalidate>
      <h1 class="lock-title">سجل مشاكل الفريق</h1>
      <p class="muted">اكتب باسورد الفريق عشان تدخل.</p>
      <input id="lock-input" type="password" placeholder="الباسورد" autocomplete="current-password" />
      <p id="lock-error" class="field-error" hidden>الباسورد غلط، جرّب تاني.</p>
      <button type="submit" class="btn btn-primary">دخول</button>
    </form>
  </div>

  <main id="app" hidden>
    <header class="masthead">
      <div>
        <h1>سجل مشاكل الفريق</h1>
        <p id="summary" class="summary">بيحمّل…</p>
      </div>
      <span id="mode-badge" class="mode"></span>
    </header>

    <div id="banner" class="banner" hidden>
      <p id="banner-text"></p>
      <button id="banner-action" type="button" class="btn btn-ghost btn-sm" hidden></button>
    </div>

    <!-- تسجيل مشكلة جديدة -->
    <section class="panel compose" aria-labelledby="compose-title">
      <h2 id="compose-title">سجّل مشكلة جديدة</h2>
      <form id="issue-form" novalidate>
        <div class="field">
          <label for="title">اسم المشكلة <span class="req" aria-hidden="true">*</span></label>
          <input id="title" type="text" maxlength="120" placeholder="مثلًا: البوت مش بيرد على طلبات الواتساب" autocomplete="off" />
          <p class="field-error" id="title-error" hidden>اكتب اسم للمشكلة عشان تظهر بيه في القايمة.</p>
        </div>

        <div class="field">
          <label for="details">وصف المشكلة <span class="optional">اختياري</span></label>
          <textarea id="details" rows="3" placeholder="حصلت إمتى؟ فين بالظبط؟ جربت إيه؟"></textarea>
        </div>

        <div class="field">
          <label for="note">ملاحظة <span class="optional">اختياري</span></label>
          <textarea id="note" rows="2" placeholder="أي حاجة زيادة حابب تقولها"></textarea>
        </div>

        <div class="field">
          <label for="author">اسمك <span class="req" aria-hidden="true">*</span></label>
          <div class="inline">
            <input id="author" type="text" maxlength="60" list="names" placeholder="اكتب اسمك" autocomplete="name" />
            <button id="submit-btn" type="submit" class="btn btn-primary">سجّل المشكلة</button>
          </div>
          <p class="field-error" id="author-error" hidden>اكتب اسمك عشان الفريق يعرف مين سجّل المشكلة.</p>
        </div>
        <p class="hint">التاريخ والوقت بيتسجلوا تلقائي.</p>
      </form>
      <datalist id="names"></datalist>
    </section>

    <!-- الأقسام -->
    <section class="board" aria-label="المشاكل">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" class="tab" id="tab-open" data-status="open" aria-selected="true">
          متحلتش <span class="count" id="count-open">0</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-solved" data-status="solved" aria-selected="false">
          اتحلت <span class="count" id="count-solved">0</span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-all" data-status="all" aria-selected="false">
          كل المشاكل <span class="count" id="count-all">0</span>
        </button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search" type="search" placeholder="دوّر باسم المشكلة أو اسم اللي كتبها…" aria-label="بحث" />
      </div>

      <div id="list" class="list" role="tabpanel" aria-live="polite">
        <p class="list-empty">بيحمّل المشاكل…</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
