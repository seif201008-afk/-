<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>سجل مشاكل الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=202609261600" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16181d" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="مشاكل الفريق" />
</head>
<body>

<!-- الدخول: محدش يشوف حاجة قبل ما يدخل بحساب جوجل -->
<div id="auth" class="auth" dir="rtl">
  <div class="auth-card">
    <span class="brand-mark brand-mark-lg" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
    </span>
    <h1>سجل مشاكل الفريق</h1>
    <div id="auth-body" class="auth-body"><p class="muted">بيحمّل…</p></div>
  </div>
</div>

<div id="app" class="shell" dir="rtl" lang="ar" hidden>

  <!-- القايمة الجانبية -->
  <aside id="sidebar" class="sidebar" aria-label="المشاكل">
    <div class="sb-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
        </span>
        <span>مشاكل الفريق</span>
      </div>
      <button id="sb-close" class="icon-btn only-mobile" type="button" aria-label="اقفل القايمة">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <button id="presence" type="button" class="presence" data-nav="team" aria-label="الفريق: مين فاتح دلوقتي">
      <span class="presence-label"><span class="live-dot" aria-hidden="true"></span><span id="presence-text">فاتحين دلوقتي</span></span>
      <span id="presence-avatars" class="avatar-stack"></span>
    </button>

    <button id="new-btn" type="button" class="btn btn-primary btn-block">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      مشكلة جديدة
    </button>

    <nav class="sb-nav" aria-label="صفحات">
      <button type="button" class="sb-nav-btn" data-nav="chat" id="nav-chat">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" /></svg>
        الشات
      </button>
      <button type="button" class="sb-nav-btn" data-nav="team" id="nav-team">
        <svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5" /></svg>
        الفريق
      </button>
      <button type="button" class="sb-nav-btn" data-nav="stats" id="nav-stats">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
        الإحصائيات
      </button>
    </nav>

    <div class="sb-search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      <input id="search" class="input" type="search" placeholder="دوّر في المشاكل" aria-label="دوّر في المشاكل" />
      <kbd class="kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="seg" role="tablist" id="tabs" aria-label="الأقسام">
      <button type="button" role="tab" id="tab-open" data-status="open">متحلتش <span class="n" id="count-open">0</span></button>
      <button type="button" role="tab" id="tab-solved" data-status="solved">اتحلت <span class="n" id="count-solved">0</span></button>
      <button type="button" role="tab" id="tab-all" data-status="all">الكل <span class="n" id="count-all">0</span></button>
    </div>

    <div class="sb-filters">
      <button type="button" id="mine-btn" class="chip-btn" aria-pressed="false">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
        مشاكلي <span class="n" id="count-mine">0</span>
      </button>
      <button type="button" id="filter-chip" class="chip-btn active" hidden>
        <span id="filter-chip-text"></span>
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <nav id="list" class="sb-list" aria-label="قايمة المشاكل"></nav>

    <div class="sb-foot">
      <button id="me-btn" class="me" type="button" data-nav="settings">
        <span id="me-av" class="me-av"></span>
        <span class="me-text">
          <span id="me-name" class="me-name"></span>
          <span class="me-sub">حسابي والإعدادات</span>
        </span>
        <svg class="i me-edit" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
      </button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- المحتوى -->
  <main id="main" class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn only-mobile" type="button" aria-label="افتح قايمة المشاكل">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        <span id="menu-dot" class="menu-dot" hidden></span>
      </button>
      <div id="crumb" class="crumb"></div>
      <div id="top-actions" class="top-actions"></div>
    </header>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <span class="notice-actions">
        <button id="notice-action" type="button" class="link-btn" hidden></button>
        <button id="notice-close" type="button" class="icon-btn notice-close" aria-label="اقفل" hidden>
          <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </span>
    </div>

    <div id="view" class="view"></div>
  </main>
</div>

<datalist id="names"></datalist>

<!-- نافذة واحدة لكل الحوارات (الترحيب، فكّرني، اربط...) -->
<dialog id="modal" class="dialog" dir="rtl">
  <div id="modal-body"></div>
</dialog>

<!-- عارض الصور -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصور" dir="rtl" hidden>
  <div class="lb-bar">
    <span id="lb-count" class="lb-count"></span>
    <div class="lb-actions">
      <a id="lb-open" class="lb-btn" href="#" target="_blank" rel="noopener">افتح الأصل</a>
      <button id="lb-delete" class="lb-btn danger" type="button">امسح الصورة</button>
      <button id="lb-close" class="lb-btn lb-icon" type="button" aria-label="اقفل">
        <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
  </div>
  <div id="lb-stage" class="lb-stage">
    <button id="lb-prev" class="lb-nav lb-prev" type="button" aria-label="الصورة اللي قبلها">
      <svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
    </button>
    <img id="lb-img" alt="" />
    <button id="lb-next" class="lb-nav lb-next" type="button" aria-label="الصورة اللي بعدها">
      <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
    </button>
  </div>
</div>

<input id="file-input" type="file" accept="image/*" multiple hidden />
<input id="chat-file-input" type="file" multiple hidden />
<input id="avatar-input" type="file" accept="image/*" hidden />

<div id="toast" class="toast" dir="rtl" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.2/dist/umd/supabase.js"></script>
<script src="config.js?v=202609261600"></script>
<script src="app.js?v=202609261600"></script>
</body>
</html>
